# Entorno completo de la vista del analista: Postgres + la app (API, agente y frontend).
#
# Un solo comando lo levanta (./run.sh o `docker compose up --build -d`), en una máquina
# sin el dataset de Kaggle: la app aplica el esquema y carga semilla/ al arrancar
# (app/db/migrar.py). Diseño: diseno/persistencia.md.
#
# Todo valor configurable sale de .env (opcional; se crea desde .env.example). Si .env
# no existe, se usan los valores por defecto de abajo, que son solo de desarrollo.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraude
      POSTGRES_USER: fraude
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraude_dev}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # La base no se publica en el host: solo la app la usa, por la red interna de
    # compose. Así no choca con un Postgres local en el puerto 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraude -d fraude"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .                 # la raíz: la imagen necesita app/ y semilla/
      dockerfile: app/Dockerfile
    env_file:
      - path: .env
        required: false          # sin .env la app arranca igual (sin llaves: explicación de plantilla)
    environment:
      # Vacío o ausente en .env = se arma con POSTGRES_PASSWORD apuntando al servicio db.
      DATABASE_URL: ${DATABASE_URL:-postgresql://fraude:${POSTGRES_PASSWORD:-fraude_dev}@db:5432/fraude}
    ports:
      # Solo en esta máquina: sin login (M2), nadie en la red del aula debe poder
      # forzar fallas, firmar decisiones ni gastar crédito del LLM.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datos_postgres:
